name: electron-build-windows-portable

on: [push, pull_request]

permissions:
  contents: write

jobs:
  AssembleRelease:
    if: github.repository == 'mrjo118/joplin'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: yarn

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        env:
          SKIP_ONENOTE_CONVERTER_BUILD: 1

      - name: Build Windows portable application
        working-directory: packages/app-desktop
        run: npm run dist -- --win portable --publish never

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          $version = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create tag
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${process.env.RELEASE_VERSION}`,
              sha: context.sha,
            });

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          draft: false
          prerelease: false
          release_name: ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}

      - name: Upload Windows portable executable
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./packages/app-desktop/dist/JoplinPortable.exe
          asset_name: JoplinPortable.exe
          asset_content_type: application/vnd.microsoft.portable-executable
